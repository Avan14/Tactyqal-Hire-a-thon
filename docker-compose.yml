services:
  db:
    image: postgres:17-alpine
    container_name: tactyqal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tactyqal
      POSTGRES_PASSWORD: tactyqal
      POSTGRES_DB: tactyqal
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactyqal -d tactyqal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
